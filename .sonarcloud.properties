# Reference solutions keep LeetCode's method and parameter names, which the judge calls and the starter code shows.
sonar.issue.ignore.multicriteria=methodNames,parameterNames
sonar.issue.ignore.multicriteria.methodNames.ruleKey=python:S100
sonar.issue.ignore.multicriteria.methodNames.resourceKey=content/leetcode/**/*.py
sonar.issue.ignore.multicriteria.parameterNames.ruleKey=python:S117
sonar.issue.ignore.multicriteria.parameterNames.resourceKey=content/leetcode/**/*.py
